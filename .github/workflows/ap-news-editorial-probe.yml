name: AP News isolated editorial control probe
on:
  workflow_dispatch:
concurrency:
  group: ap-news-editorial-control-probe
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: scope
            flag: --scope-only
          - mode: historical
            flag: --historical-only
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      DO_NOT_TRACK: '1'
      AP_NEWS_REPAIR_REHEARSAL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 647cb8c78fe30e59620b6410ecc7d8c86623a0a3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare credential-free local CPU verifier
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          pip install -r requirements-newsletter-server.txt beautifulsoup4==4.13.3 huggingface-hub==0.28.1
          mkdir -p .cpu-runtime .control-probe
          curl --fail --location --retry 2 https://github.com/ggml-org/llama.cpp/releases/download/b12244/llama-b12244-bin-ubuntu-x64.tar.gz -o "$RUNNER_TEMP/llama.tar.gz"
          echo "c1d7e7f31b5c43f3e5d44f667b4d57104217be3e5f2060320cd3735651238849  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C .cpu-runtime
      - name: Verify ${{ matrix.mode }} controls on fixed public CPU verifier
        run: python scripts/newsletter_control_probe.py --runtime .cpu-runtime --folder .control-probe ${{ matrix.flag }}
      - name: Preserve private decisions and model receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ap-news-editorial-controls-${{ github.run_id }}-${{ matrix.mode }}
          path: .control-probe/
          include-hidden-files: true
          retention-days: 3
