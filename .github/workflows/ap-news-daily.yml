name: AP News server daily

on:
  schedule:
    # KST 06:00–09:45. Prepare before 08:00, retry unfinished stages afterwards.
    - cron: '0,15,30,45 21-23 * * *'
    - cron: '0,15,30,45 0 * * *'
  workflow_dispatch:
    inputs:
      connection_test:
        description: Verify text/image API access without sending another email
        type: boolean
        default: false

concurrency:
  group: ap-news-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
    outputs:
      due: ${{ steps.prepare.outputs.due }}
      day: ${{ steps.clock.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-newsletter*.txt
      - name: Install pinned publishing tools
        run: |
          pip install -r requirements-newsletter-server.txt
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m playwright install --with-deps chromium
      - name: Determine KST edition and recover last checkpoint
        id: clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Asia/Seoul date +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts | map(select(.expired == false and (.name | startswith(\"ap-news-state-$day-\")))) | sort_by(.created_at) | reverse | .[0].id // empty")
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/ap-news-state.zip
            mkdir -p .ap-news-state
            unzip -oq /tmp/ap-news-state.zip -d .ap-news-state
          fi
      - name: API connection test (no subscriber messages)
        if: ${{ inputs.connection_test == true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/newsletter_server.py connection-test
      - name: Test safety gates
        run: |
          python scripts/test_newsletter_server.py
          python scripts/test_newsletter.py
          node --test supabase/functions/ap-news/core.test.mjs
      - name: Prepare and verify today's edition
        id: prepare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/newsletter_server.py prepare
          python scripts/check_site.py
      - name: Commit only verified newsletter changes after 08:00 KST
        if: ${{ steps.prepare.outputs.due == 'true' }}
        env:
          EDITION_DAY: ${{ steps.clock.outputs.day }}
        run: |
          git config user.name 'AP News Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "site-source/newsletter/issues/$EDITION_DAY.json" img/newsletter/ ko/news/daily/ newsletters/ ko/news/index.html en/news/index.html vi/news/index.html ja/news/index.html zh-cn/news/index.html fr/news/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "news: publish AP News $EDITION_DAY"
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Preserve drafts, completed images and page previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ap-news-state-${{ steps.clock.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ap-news-state/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.due == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  register:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public web/PDF before registering mail edition
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ needs.prepare.outputs.day }}
        run: |
          for attempt in 1 2 3 4; do
            if python scripts/newsletter_server.py register --date "$EDITION_DAY"; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 30
          done
          python scripts/newsletter_server.py mail-status --date "$EDITION_DAY"
