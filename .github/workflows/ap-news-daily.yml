name: AP News server daily

on:
  schedule:
    # KST 08:00 publication target, then recovery checks through09:45.
    - cron: '0,5,10,20,30,45 23 * * *'
    - cron: '0,15,30,45 0 * * *'
  workflow_dispatch:
    inputs:
      verify_ready:
        description: Verify today's completed draft-release bundle without creating content
        type: boolean
        default: false

concurrency:
  group: ap-news-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      due: ${{ steps.prepare.outputs.due }}
      day: ${{ steps.prepare.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-newsletter*.txt
      - name: Install document validators (no AI API)
        run: pip install -r requirements-newsletter-server.txt
      - name: Verify uploaded completed bundle
        if: ${{ inputs.verify_ready == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/newsletter_server.py verify-ready
      - name: Test safety gates
        run: |
          python scripts/test_newsletter_handoff.py
          python scripts/test_newsletter_server.py
          python scripts/test_newsletter.py
          node --test supabase/functions/ap-news/core.test.mjs
      - name: Accept today's completed edition after08:00 KST
        id: prepare
        if: ${{ inputs.verify_ready != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/newsletter_server.py prepare
          python scripts/check_site.py
      - name: Commit only completed newsletter files
        if: ${{ steps.prepare.outputs.due == 'true' }}
        env:
          EDITION_DAY: ${{ steps.prepare.outputs.day }}
        run: |
          git config user.name 'AP News Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "site-source/newsletter/issues/$EDITION_DAY.json" img/newsletter/ ko/news/daily/ newsletters/ ko/news/index.html en/news/index.html vi/news/index.html ja/news/index.html zh-cn/news/index.html fr/news/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "news: publish AP News $EDITION_DAY"
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ap-news-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ap-news-state/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.due == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  register:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public files and register existing subscriber queue
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ needs.prepare.outputs.day }}
        run: |
          for attempt in 1 2 3 4; do
            if python scripts/newsletter_server.py register --date "$EDITION_DAY"; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 30
          done
          python scripts/newsletter_server.py mail-status --date "$EDITION_DAY"
