name: AP News server daily

on:
  schedule:
    # KST 08:00 publication target, then recovery checks through09:45.
    - cron: '0,5,10,20,30,45 23 * * *'
    - cron: '0,15,30,45 0 * * *'
  workflow_dispatch:
    inputs:
      verify_ready:
        description: Verify today's completed draft-release bundle without creating content
        type: boolean
        default: false
      record_handoff:
        description: Record server receipt of a completed bundle in the admin page (no publication)
        type: boolean
        default: false
      reserve_publication:
        description: Validate completed bundle now and reserve publication at08:00 KST
        type: boolean
        default: false
      edition_date:
        description: Optional edition date YYYY-MM-DD (defaults to today in Korea)
        type: string
        default: ''

concurrency:
  group: ap-news-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}
    timeout-minutes: ${{ inputs.reserve_publication == true && 360 || 15 }}
    permissions:
      contents: write
    outputs:
      due: ${{ steps.prepare.outputs.due }}
      day: ${{ steps.clock.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout reviewed newsletter runtime (independent of homepage main)
        uses: actions/checkout@v7
        with:
          ref: e763748fd54c1e8e0887f997b3942e6be01d69d9
          path: .ap-news-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ap-news-runtime/requirements-newsletter*.txt
      - name: Install document validators (no AI API)
        run: pip install -r .ap-news-runtime/requirements-newsletter-server.txt
      - name: Determine edition date
        id: clock
        env:
          REQUESTED_DATE: ${{ inputs.edition_date }}
        run: |
          day=${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}
          python -c 'import datetime,sys; datetime.date.fromisoformat(sys.argv[1])' "$day"
          echo "day=$day" >> "$GITHUB_OUTPUT"
      - name: Verify uploaded completed bundle
        if: ${{ inputs.verify_ready == true || inputs.record_handoff == true || inputs.reserve_publication == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.clock.outputs.day }}
        run: python .ap-news-runtime/scripts/newsletter_server.py verify-ready --date "$EDITION_DAY"
      - name: Record server receipt (no publication or email)
        if: ${{ (inputs.record_handoff == true || inputs.reserve_publication == true) && inputs.verify_ready != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ steps.clock.outputs.day }}
        run: python .ap-news-runtime/scripts/newsletter_status.py handoff --date "$EDITION_DAY"
      - name: Test reviewed newsletter safety gates
        working-directory: .ap-news-runtime
        env:
          AP_NEWS_SITE_ROOT: ''
        run: |
          python scripts/test_newsletter_isolation.py
          python scripts/test_newsletter_analytics_boundary.py
          python scripts/test_newsletter_handoff.py
          python scripts/test_newsletter_server.py
          python scripts/test_newsletter_status.py
          python scripts/test_newsletter_editorial.py
          python scripts/test_newsletter_reservation.py
          python scripts/test_newsletter.py
          python scripts/test_newsletter_unattended.py
          node --test supabase/functions/ap-news/core.test.mjs
      - name: Keep verified reservation until08:00 KST
        if: ${{ inputs.reserve_publication == true && inputs.verify_ready != true && inputs.record_handoff != true }}
        env:
          EDITION_DAY: ${{ steps.clock.outputs.day }}
        run: python .ap-news-runtime/scripts/newsletter_server.py wait-until-due --date "$EDITION_DAY"
      - name: Accept today's completed edition after08:00 KST
        id: prepare
        if: ${{ inputs.verify_ready != true && inputs.record_handoff != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.clock.outputs.day }}
        run: |
          python .ap-news-runtime/scripts/newsletter_server.py prepare --date "$EDITION_DAY"
      - name: Record publication readiness
        if: ${{ inputs.verify_ready != true && inputs.record_handoff != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ steps.clock.outputs.day }}
          EDITION_STATE: ${{ steps.prepare.outputs.state }}
          EDITION_DUE: ${{ steps.prepare.outputs.due }}
        run: |
          if [ "$EDITION_STATE" = ready ]; then
            python .ap-news-runtime/scripts/newsletter_status.py handoff --date "$EDITION_DAY"
          fi
          if [ "$EDITION_DUE" = true ]; then
            python .ap-news-runtime/scripts/newsletter_status.py started --date "$EDITION_DAY"
          elif [ "$EDITION_STATE" = awaiting_ready ]; then
            python .ap-news-runtime/scripts/newsletter_status.py waiting --date "$EDITION_DAY"
          fi
      - name: Commit only completed newsletter files
        if: ${{ steps.prepare.outputs.due == 'true' }}
        env:
          EDITION_DAY: ${{ steps.prepare.outputs.day }}
        run: |
          git config user.name 'AP News Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "site-source/newsletter/issues/$EDITION_DAY.json" img/newsletter/ ko/news/daily/ newsletters/ ko/news/index.html en/news/index.html vi/news/index.html ja/news/index.html zh-cn/news/index.html fr/news/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "news: publish AP News $EDITION_DAY"
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ap-news-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ap-news-state/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.due == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ap-news-pages.yml

  register:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout reviewed newsletter runtime (independent of homepage main)
        uses: actions/checkout@v7
        with:
          ref: e763748fd54c1e8e0887f997b3942e6be01d69d9
          path: .ap-news-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public files and register existing subscriber queue
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ needs.prepare.outputs.day }}
        run: |
          python .ap-news-runtime/scripts/newsletter_status.py deployed --date "$EDITION_DAY"
          for attempt in 1 2 3 4; do
            if python .ap-news-runtime/scripts/newsletter_server.py register --date "$EDITION_DAY"; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 30
          done
          python .ap-news-runtime/scripts/newsletter_status.py published --date "$EDITION_DAY"
          python .ap-news-runtime/scripts/newsletter_server.py wait-mail --date "$EDITION_DAY"

  report_failure:
    needs: [prepare, deploy, register]
    if: ${{ always() && inputs.verify_ready != true && (needs.prepare.result == 'failure' || needs.deploy.result == 'failure' || needs.register.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout reviewed newsletter runtime (independent of homepage main)
        uses: actions/checkout@v7
        with:
          ref: e763748fd54c1e8e0887f997b3942e6be01d69d9
          path: .ap-news-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record failed server processing without sending mail
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REQUESTED_DATE: ${{ needs.prepare.outputs.day }}
        run: |
          day=${REQUESTED_DATE:-$(TZ=Asia/Seoul date +%F)}
          python .ap-news-runtime/scripts/newsletter_status.py error --date "$day" --error '서버 처리에 실패했습니다. 상세 실행 기록을 확인하세요.'
