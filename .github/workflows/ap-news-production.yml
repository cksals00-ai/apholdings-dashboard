name: AP News server production
run-name: ${{ github.event_name == 'workflow_run' && 'AP News server rollout verification (no publication)' || 'AP News server production' }}
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['AP News server production rehearsal']
    types: [completed]
  schedule:
    # KST03:05/03:35 and04:05–07:05 recovery. Production is gated on full server proof.
    - cron: '5,35 18 * * *'
    - cron: '5 19-22 * * *'
concurrency:
  group: ap-news-server-production
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  qualification:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.html_url == 'https://github.com/cksals00-ai/apholdings-dashboard/actions/runs/41031927070' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      qualified: ${{ steps.proof.outputs.qualified }}
    steps:
      - name: Checkout immutable rollout verifier without homepage assets
        uses: actions/checkout@v7
        with:
          ref: 77f08d24631414587e1d5e20406d1aacb08826a0
          sparse-checkout: scripts
          path: .qualification-runtime
      - name: Test fail-closed rollout conditions
        run: python3 -m unittest discover -s .qualification-runtime/scripts -p 'test_newsletter*qualification.py'
      - name: Require real recovered source-to-public-preview-and-mail server qualification
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REVISION: ${{ github.sha }}
        run: python3 .qualification-runtime/scripts/newsletter_environment_qualification.py --full 41031927070 --probe 41543046848 --revision "$CALLER_REVISION" --runtime e31f34ddd49565cab7d366d7572a79842ca2f347
  produce:
    needs: qualification
    if: ${{ needs.qualification.outputs.qualified == 'true' && github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/ap-news-produce.yml
    with:
      dry_run: false
    secrets: inherit
