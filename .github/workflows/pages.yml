name: Publish existing AP Holdings site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ap-holdings-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Package tracked existing site (no other generators)
        run: |
          mkdir .pages-site
          git archive HEAD | tar -x -C .pages-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-site
          include-hidden-files: true
      - name: Deploy existing domain
        id: deployment
        uses: actions/deploy-pages@v5
