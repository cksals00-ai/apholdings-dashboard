name: AP News automation rehearsal
on:
  workflow_dispatch:
    inputs:
      due_at:
        description: ISO UTC time within15 minutes for isolated automated test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ap-news-rehearsal
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout reviewed newsletter runtime
        uses: actions/checkout@v7
        with:
          ref: f38cded5abffd43f49c4c3dc95191563b0bc0d6f
          path: .ap-news-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r .ap-news-runtime/requirements-newsletter-server.txt
      - name: Inject unrelated homepage tool failures (never committed)
        run: |
          printf 'raise RuntimeError("INJECTED_HOMEPAGE_FAILURE")\n' > scripts/check_site.py
          printf 'raise RuntimeError("INJECTED_HOMEPAGE_FAILURE")\n' > scripts/newsletter.py
          printf 'raise RuntimeError("INJECTED_HOMEPAGE_FAILURE")\n' > analytics/install.py
      - name: Await scheduled test and inject first publication failure
        env:
          REHEARSAL_DUE: ${{ inputs.due_at }}
        run: python .ap-news-runtime/scripts/newsletter_ops.py build
      - name: Publish isolated preview files only
        run: |
          git config user.name 'AP News Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "ko/news/daily/preview/automation-$GITHUB_RUN_ID/index.html" "newsletters/previews/AP-News-test-$GITHUB_RUN_ID.pdf"
          if ! git diff --cached --quiet; then git commit -m "test(news): publish isolated automation preview"; fi
          git restore scripts/check_site.py scripts/newsletter.py analytics/install.py
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ github.run_id }}
          path: .ap-news-state/rehearsal/
          include-hidden-files: true
  deploy:
    needs: preview
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ap-news-pages.yml
    with:
      test_homepage_failure: true
  verify_and_mail:
    needs: [preview,deploy]
    runs-on: ubuntu-latest
    env:
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout reviewed newsletter runtime
        uses: actions/checkout@v7
        with:
          ref: f38cded5abffd43f49c4c3dc95191563b0bc0d6f
          path: .ap-news-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: rehearsal-${{ github.run_id }}
          path: .ap-news-state/rehearsal/
      - name: Verify actual public files, inject mail failure, retry and notify recovery
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_URL: https://github.com/cksals00-ai/apholdings-dashboard/actions/runs/${{ github.run_id }}
        run: python .ap-news-runtime/scripts/newsletter_ops.py finish
