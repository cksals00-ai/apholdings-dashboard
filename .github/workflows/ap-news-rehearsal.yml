name: AP News automation rehearsal
on:
  workflow_dispatch:
    inputs:
      due_at:
        description: ISO UTC time within15 minutes for isolated automated test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ap-news-rehearsal
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-newsletter-server.txt
      - name: Await scheduled test and inject first publication failure
        env:
          REHEARSAL_DUE: ${{ inputs.due_at }}
        run: python scripts/newsletter_ops.py build
      - name: Publish isolated preview files only
        run: |
          git config user.name 'AP News Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "ko/news/daily/preview/automation-$GITHUB_RUN_ID/index.html" "newsletters/previews/AP-News-test-$GITHUB_RUN_ID.pdf"
          git commit -m "test(news): publish isolated automation preview"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ github.run_id }}
          path: .ap-news-state/rehearsal/
          include-hidden-files: true
  deploy:
    needs: preview
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
  verify_and_mail:
    needs: [preview,deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: rehearsal-${{ github.run_id }}
          path: .ap-news-state/rehearsal/
      - name: Verify actual public files, inject mail failure, retry and notify recovery
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_URL: https://github.com/cksals00-ai/apholdings-dashboard/actions/runs/${{ github.run_id }}
        run: python scripts/newsletter_ops.py finish
