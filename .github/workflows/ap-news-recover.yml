name: AP News automatic recovery
on:
  workflow_run:
    workflows: ['AP News server daily', 'AP News automation rehearsal', 'AP News server production', 'AP News server production rehearsal']
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  recover:
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name != 'AP News server daily' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 26d4c0724b61c344ba5ffe16c713f4fa8de25a87
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checkout recovery classification only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .recovery-policy
          sparse-checkout: scripts/newsletter_recovery_policy.py
          sparse-checkout-cone-mode: false
      - name: Classify closed qualification gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_NAME: ${{ github.event.workflow_run.name }}
        run: |
          gh api "repos/cksals00-ai/apholdings-dashboard/actions/runs/$FAILED_RUN_ID/attempts/$FAILED_ATTEMPT/jobs?per_page=100" > /tmp/ap-news-recovery-jobs.json
          if [ "$FAILED_NAME" = 'AP News server production rehearsal' ]; then
            : > /tmp/ap-news-recovery-failure.log
          else
            gh run view "$FAILED_RUN_ID" --attempt "$FAILED_ATTEMPT" --log-failed --repo cksals00-ai/apholdings-dashboard > /tmp/ap-news-recovery-failure.log
          fi
          python .recovery-policy/scripts/newsletter_recovery_policy.py "$FAILED_NAME" /tmp/ap-news-recovery-failure.log < /tmp/ap-news-recovery-jobs.json >> "$GITHUB_OUTPUT"
      - name: Record known inactive rollout gate without retrying
        if: ${{ steps.gate.outputs.blocked == 'true' }}
        run: echo '::notice::Known cancelled qualification trial; production remains inactive. No repeated recovery alert or automatic retry.'
      - name: Notify owner before automatic recovery
        if: ${{ steps.gate.outputs.blocked != 'true' && github.event.workflow_run.name != 'AP News server production rehearsal' }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_NAME: ${{ github.event.workflow_run.name }}
        run: python scripts/newsletter_ops.py alert
      - name: Automatically retry failed jobs (at most three attempts)
        if: ${{ steps.gate.outputs.blocked != 'true' && github.event.workflow_run.run_attempt < 3 && (github.event.workflow_run.name != 'AP News server production rehearsal' || steps.gate.outputs.rehearsal_retry_allowed == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$FAILED_RUN_ID" --failed --repo cksals00-ai/apholdings-dashboard
