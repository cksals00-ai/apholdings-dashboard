name: AP News automatic recovery
on:
  workflow_run:
    workflows: ['AP News server daily', 'AP News automation rehearsal']
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e763748fd54c1e8e0887f997b3942e6be01d69d9
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Notify owner before automatic recovery
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_NAME: ${{ github.event.workflow_run.name }}
        run: python scripts/newsletter_ops.py alert
      - name: Automatically retry failed jobs (at most three attempts)
        if: ${{ github.event.workflow_run.run_attempt < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$FAILED_RUN_ID" --failed --repo cksals00-ai/apholdings-dashboard
