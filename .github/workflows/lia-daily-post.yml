name: 리아 하루 한 편

# 매일 KST 18:00 (UTC 09:00). 수동 실행도 가능.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: lia-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 리아 릴 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/lia_daily_post.py
