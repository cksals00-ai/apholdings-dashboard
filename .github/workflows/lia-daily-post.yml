name: 리아 하루 한 편

# 매일 KST 15:00 (UTC 06:00) + 예비 KST 20:00 (UTC 11:00).
# GitHub 예약은 수 시간 늦게 도는 일이 잦아 18:00 예약이 자정을 넘겨 하루가 비는 일이 있었음(10/26).
# 같은 시리즈가 18시간 안에 올라갔으면 스크립트가 건너뛰므로 하루 1편은 그대로 유지된다.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: lia-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 리아 릴 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/lia_daily_post.py
