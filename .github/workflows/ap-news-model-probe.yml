name: AP News CPU model probe
on:
  workflow_dispatch:
  push:
    branches: [feat/ap-news-server-producer]
    paths: [.github/workflows/ap-news-model-probe.yml, scripts/newsletter_model_probe.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install diffusers==0.32.2 transformers==4.48.3 accelerate==1.3.0 huggingface-hub==0.28.1 Pillow==11.1.0
      - name: Download pinned public CPU runtime (no inference service)
        run: |
          mkdir -p .cpu-runtime probe-output
          curl --fail --location --retry 2 https://github.com/ggml-org/llama.cpp/releases/download/b5401/llama-b5401-bin-ubuntu-x64.zip -o /tmp/llama.zip
          unzip -q /tmp/llama.zip -d .cpu-runtime
      - name: Run real CPU text and image generation
        run: python scripts/newsletter_model_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ap-news-cpu-probe
          path: probe-output/
