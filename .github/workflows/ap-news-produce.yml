name: AP News isolated CPU production worker
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      resume_run:
        type: string
        default: ''
      inject_failure:
        type: boolean
        default: false
    outputs:
      day:
        value: ${{ jobs.produce.outputs.day }}
permissions:
  contents: write
  actions: write
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      DO_NOT_TRACK: '1'
      AP_NEWS_SITE_ROOT: ${{ github.workspace }}/.production-content
    outputs:
      day: ${{ steps.gate.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Checkout reviewed producer runtime
        uses: actions/checkout@v7
        with:
          ref: 7d73b33bb7c7c252d153fc812c1d61e92e25c3fc
          path: .production-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check current Korean edition and existing completed handoff
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess,zoneinfo
          day=datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Seoul')).date().isoformat()
          dry=os.environ['DRY_RUN']=='true'
          path=pathlib.Path('site-source/newsletter/issues')/(day+'.json')
          published=path.exists() and json.loads(path.read_text()).get('status')=='published'
          ready=False
          if not dry and not published:
              import sys
              sys.path.insert(0,'.production-runtime/scripts')
              from newsletter_checkpoint import metadata
              release=metadata('ap-news-ready-'+day)
              if release is not None:
                  ready=any(a['name']==f'AP-News-{day}-ready.zip' and a['size']>1000 and a['state']=='uploaded' for a in release['assets'])
          produce=dry or (not published and not ready)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'day={day}\nproduce={str(produce).lower()}\nexisting_ready={str(ready).lower()}\n')
          print({'day':day,'produce':produce,'already_published':published,'existing_ready':ready})
          PY
      - name: Stage content independently of homepage tools
        if: ${{ steps.gate.outputs.produce == 'true' }}
        run: |
          mkdir -p "$AP_NEWS_SITE_ROOT"
          git archive HEAD | tar -x -C "$AP_NEWS_SITE_ROOT"
      - name: Restore same-day private draft checkpoint across retries and scheduled runs
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME_RUN: ${{ inputs.resume_run }}
          AP_NEWS_REPAIR_REHEARSAL: ${{ inputs.dry_run == true && inputs.inject_failure == true && '1' || '' }}
        run: |
          mode=production
          if [ "$DRY_RUN" = true ]; then mode=test; fi
          python .production-runtime/scripts/newsletter_checkpoint.py restore --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --mode "$mode"
          if [ "$mode" = test ] && [ -n "$RESUME_RUN" ] && [ ! -f "$AP_NEWS_SITE_ROOT/.production-state/draft.json" ]; then
            python .production-runtime/scripts/newsletter_checkpoint.py restore --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --mode test --run "$RESUME_RUN" --required
          fi
      - name: Install validators
        if: ${{ steps.gate.outputs.produce == 'true' || steps.gate.outputs.existing_ready == 'true' }}
        run: pip install -r .production-runtime/requirements-newsletter-server.txt
      - name: Free disposable runner SDK before model caches
        if: ${{ steps.gate.outputs.produce == 'true' }}
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
      - uses: actions/cache@v5
        if: ${{ steps.gate.outputs.produce == 'true' }}
        with:
          path: ~/.cache/huggingface/hub
          key: ap-news-public-images-v7-ssd-clip
      - uses: actions/cache@v5
        if: ${{ steps.gate.outputs.produce == 'true' }}
        with:
          path: ~/.cache/ap-news-text/copy
          key: ap-news-copy-qwen3-8b-7c41481f
      # The larger art-planning weights are not cached; keep individual cache entries bounded.
      - name: Install CPU-only public model libraries and browser validators
        if: ${{ steps.gate.outputs.produce == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r .production-runtime/requirements-newsletter-producer.txt
          python -m playwright install --with-deps chromium
          mkdir -p .cpu-runtime
          curl --fail --location --retry 2 https://github.com/ggml-org/llama.cpp/releases/download/b12244/llama-b12244-bin-ubuntu-x64.tar.gz -o "$RUNNER_TEMP/llama.tar.gz"
          echo "c1d7e7f31b5c43f3e5d44f667b4d57104217be3e5f2060320cd3735651238849  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C .cpu-runtime
      - name: Test reviewed producer and publisher gates
        if: ${{ steps.gate.outputs.produce == 'true' }}
        working-directory: .production-runtime
        env:
          AP_NEWS_SITE_ROOT: ''
        run: |
          python -m unittest discover -s scripts -p 'test_newsletter*.py'
          node --test supabase/functions/ap-news/core.test.mjs
      - name: Seed isolated real repair rehearsal from verified current-day sources
        if: ${{ steps.gate.outputs.produce == 'true' && inputs.dry_run == true && inputs.inject_failure == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
          AP_NEWS_REPAIR_REHEARSAL: '1'
          RESUME_RUN: ${{ inputs.resume_run }}
        run: python .production-runtime/scripts/newsletter_repair_rehearsal.py seed --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --run "$GITHUB_RUN_ID" --dry-run --resume-run "$RESUME_RUN"
      - name: Require actual exact-runtime controls without repeating passed inference
        if: ${{ steps.gate.outputs.produce == 'true' && inputs.dry_run == true && inputs.inject_failure == true && github.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
          PYTHONPATH: ${{ github.workspace }}/.production-runtime/scripts
        run: |
          python .production-runtime/scripts/newsletter_control_handoff.py --source-run 42885393201 --expected-head a5cb11716fb6e6740df5cdcf35148980aa806bca --expected-runtime 7d73b33bb7c7c252d153fc812c1d61e92e25c3fc --definition-sha c6f844100c33024a4c44d88eb2d292779ef42fb5f30ef9429c601fc11fe3aa6c --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --folder "$RUNNER_TEMP/qualified-controls"
          python - <<'PY_SCOPE'
          import json, os
          from pathlib import Path
          # SCOPE_GROUND_TRUTH_BEGIN
          def assert_scope_ground_truth(receipt):
              expected = {(field, 0): ('pure_proposal', []) if field == 'insight' else ('asserted_or_mixed', [(0, 2)]) for field in ('title', 'summary', 'fact', 'insight')}
              ranges = [[], [(0, 3)], [], [(0, 2)], [(0, 2)], [(1, 5)], [], [(0, 4)], [(0, 3)], [(0, 4)], [(0, 5)], [(0, 4)], [], [(0, 2)], [(0, 2)]]
              expected.update({('action', i): ('asserted_or_mixed' if parts else 'pure_proposal', parts) for i, parts in enumerate(ranges)})
              seen = set()
              flattened = {field: [] for field in ('title', 'summary', 'fact', 'insight', 'action')}
              if not isinstance(receipt, dict) or not isinstance(receipt.get('inventory'), list):
                  raise ValueError('Missing synthetic scope inventory')
              for row in receipt['inventory']:
                  if not isinstance(row, dict) or type(row.get('id')) is not int:
                      raise ValueError('Invalid synthetic sentence ID')
                  key = (row.get('field'), row['id'])
                  if key not in expected or key in seen:
                      raise ValueError('Unknown or duplicate synthetic sentence')
                  seen.add(key)
                  parts = row.get('premises')
                  if not isinstance(parts, list):
                      raise ValueError('Missing synthetic factual ranges')
                  for part in parts:
                      if not isinstance(part, dict) or any(type(part.get(k)) is not int for k in ('sentence_id', 'word_start', 'word_end')) or part['sentence_id'] != row['id']:
                          raise ValueError('Invalid synthetic factual range')
                  actual = (row.get('kind'), [(part['word_start'], part['word_end']) for part in parts])
                  if actual != expected[key]:
                      raise ValueError('Synthetic factual scope differs from independent ground truth: ' + str(key))
                  flattened[key[0]].extend(parts)
              if seen != set(expected) or receipt.get('facts') != flattened:
                  raise ValueError('Missing or inconsistent synthetic factual inventory')
              return True
          # SCOPE_GROUND_TRUTH_END
          scope = Path(os.environ['AP_NEWS_SITE_ROOT']) / '.production-state/qualified-control-evidence/scope/scope-controls.json'
          assert_scope_ground_truth(json.loads(scope.read_text())['receipt'])
          PY_SCOPE
      - name: Wait for Korean 03:05 actual source work window
        if: ${{ steps.gate.outputs.produce == 'true' && inputs.dry_run != true }}
        run: python .production-runtime/scripts/newsletter_start_window.py
      - name: Supervise credential-free source, copy, art and document production
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          EDITION_DAY: ${{ steps.gate.outputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AP_NEWS_ISOLATED_SOURCE_REUSE: ${{ inputs.dry_run == true && '1' || '' }}
          AP_NEWS_REPAIR_REHEARSAL: ${{ inputs.dry_run == true && inputs.inject_failure == true && '1' || '' }}
        run: |
          args=()
          mode=production
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); mode=test; fi
          python .production-runtime/scripts/newsletter_supervisor.py --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --mode "$mode" -- python .production-runtime/scripts/newsletter_producer.py --date "$EDITION_DAY" --folder "$AP_NEWS_SITE_ROOT/.production-state" --runtime .cpu-runtime --produce-only "${args[@]}"
      - name: Notify generation failure before preserving/recovering the draft
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FAILED_RUN_ID: ${{ github.run_id }}
          FAILED_ATTEMPT: ${{ github.run_attempt }}
          FAILED_NAME: ${{ github.workflow }}
        run: python .production-runtime/scripts/newsletter_ops.py alert
      - name: Preserve source evidence and unfinished work in a private company draft release
        if: ${{ always() && steps.gate.outputs.produce == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mode=production
          if [ "$DRY_RUN" = true ]; then mode=test; fi
          python .production-runtime/scripts/newsletter_checkpoint.py save --root "$AP_NEWS_SITE_ROOT" --date "$EDITION_DAY" --mode "$mode"
      - name: Inject first-attempt failure after saving validated test bundle
        if: ${{ inputs.dry_run == true && inputs.inject_failure == true && github.run_attempt == 1 }}
        run: |
          echo 'INJECTED_SERVER_PRODUCER_FAILURE: completed bundle and images preserved; automatic retry must reuse them.'
          exit 1
      - name: Transfer validated completed bundle and reserve server publication
        if: ${{ steps.gate.outputs.produce == 'true' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
        run: python .production-runtime/scripts/newsletter_handoff.py upload --date "$EDITION_DAY" --file "$AP_NEWS_SITE_ROOT/.production-state/AP-News-$EDITION_DAY-ready.zip"
      - name: Recover only missing reservation for an existing completed bundle
        if: ${{ steps.gate.outputs.existing_ready == 'true' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DAY: ${{ steps.gate.outputs.day }}
        run: |
          python .production-runtime/scripts/newsletter_server.py verify-ready --date "$EDITION_DAY"
          active=$(gh run list --repo cksals00-ai/apholdings-dashboard --workflow ap-news-daily.yml --limit 50 --json status,displayTitle,createdAt | python .production-runtime/scripts/newsletter_reservation_check.py --date "$EDITION_DAY")
          if [ "$active" = false ]; then
            python .production-runtime/scripts/newsletter_handoff.py reserve --date "$EDITION_DAY"
          fi
      - name: Notify failure before waiting for automatic recovery
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FAILED_RUN_ID: ${{ github.run_id }}
          FAILED_ATTEMPT: ${{ github.run_attempt }}
          FAILED_NAME: ${{ github.workflow }}
        run: python .production-runtime/scripts/newsletter_ops.py alert
