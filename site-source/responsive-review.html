<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AP Holdings — Responsive review</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#111;font:14px/1.5 system-ui,sans-serif}header{padding:16px 24px;background:#fff;border-bottom:1px solid #bbb;display:flex;gap:20px;flex-wrap:wrap;align-items:center}h1{font-size:16px;margin:0}label{display:flex;align-items:center;gap:8px}select,button{padding:8px;font:inherit}main{padding:24px;overflow:auto}iframe{display:block;height:900px;border:0;outline:1px solid #999;background:#fff}output{font-size:13px}a{color:#245548}
</style></head><body><header><h1>AP Holdings · Responsive review</h1><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Page<select id="page"><option value="/ko/">KO home</option><option value="/en/">EN home</option><option value="/ko/ir/">KO IR</option><option value="/en/ir/">EN IR</option><option value="/ko/products/select/">AP SELECT</option><option value="/ko/products/lia/">LIA</option><option value="/business/safelist-connect.html">Safe connector</option><option value="/business/lightlist-connect.html">Light connector</option></select></label><output id="result">390 CSS px</output><a href="/ko/">Open site</a><output id="metrics" aria-live="polite">Loading preview</output></header><main><iframe id="frame" title="Responsive website preview" src="/ko/" style="width:390px"></iframe></main><script>
const frame=document.getElementById('frame');const width=document.getElementById('width');const page=document.getElementById('page');const result=document.getElementById('result');
const metrics=document.getElementById('metrics');
function inspect(){const d=frame.contentDocument;if(!d)return;const v=d.documentElement;const font=d.defaultView.getComputedStyle(d.body).fontFamily;const bad=[...d.images].filter(i=>i.complete&&!i.naturalWidth).length;metrics.textContent=JSON.stringify({width:v.clientWidth,scrollWidth:v.scrollWidth,overflow:v.scrollWidth>v.clientWidth,font:font,notoLoaded:d.fonts.check('16px "Noto Sans KR"','한글'),brokenImages:bad});}
frame.addEventListener('load',()=>{inspect();frame.contentDocument.fonts.ready.then(inspect);new ResizeObserver(inspect).observe(frame.contentDocument.documentElement);});
width.addEventListener('change',()=>{frame.style.width=width.value+'px';result.textContent=width.value+' CSS px';requestAnimationFrame(inspect);});
page.addEventListener('change',()=>{frame.src=page.value;});
</script></body></html>
