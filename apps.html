<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.P Holdings — Apps</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap");
:root{
  --ink:#0B1210; --panel:#121C17; --panel2:#16231c; --jade:#55A27C;
  --paper:#F2EFE6; --dim:#c9c6ba; --muted:#8A948D; --line:rgba(242,239,230,.1);
  --amber:#d8a24a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);line-height:1.6;
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
.shell{max-width:880px;margin:0 auto;padding:0 20px 80px}
header{padding:72px 0 10px;border-bottom:1px solid var(--line);margin-bottom:34px}
.brand{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--jade);text-transform:uppercase}
h1{margin:8px 0 12px;font-size:clamp(28px,5vw,40px);font-weight:800;font-family:"Space Grotesk","Pretendard Variable",sans-serif}
.tag{color:var(--dim);font-size:15px;margin:0 0 6px}
.tag.en{color:var(--muted);font-size:13.5px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.app{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.icon{flex:0 0 56px;width:56px;height:56px;border-radius:13px;background:var(--panel2);
  border:1px solid rgba(85,162,124,.4);color:var(--jade);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;font-family:"Space Grotesk","Pretendard",sans-serif;letter-spacing:-.02em}
.meta{min-width:0}
.name{font-size:15.5px;font-weight:800;margin:0 0 2px}
.cat{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.desc{font-size:13.5px;color:var(--dim);margin:0}
.desc.en{font-size:12.5px;color:var(--muted);margin-top:3px}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px}
.badge.review{background:rgba(216,162,74,.15);color:var(--amber);border:1px solid rgba(216,162,74,.5)}
.badge.live{background:rgba(85,162,124,.15);color:var(--jade);border:1px solid rgba(85,162,124,.55)}
.badge.prep{background:rgba(242,239,230,.07);color:var(--muted);border:1px solid var(--line)}
.price{font-size:12px;color:var(--dim);font-weight:600}
.plink{font-size:11.5px;color:var(--muted)}
.plink a{color:var(--muted)}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="shell">

<header>
  <div class="brand">A.P Holdings</div>
  <h1>Apps</h1>
  <p class="tag">계정 없이, 광고 없이, 조용히 쓸모 있는 앱을 만듭니다.</p>
  <p class="tag en">No accounts. No ads. Quietly useful apps.</p>
</header>

<div class="grid" id="apps"></div>

<footer>
  <span>© A.P Holdings</span>
  <span>문의 cksals00@gmail.com</span>
  <a href="index.html">문샷 소개</a>
</footer>

</div>

<script>
// ── 앱 카드 데이터 (클레어 공급 문구 그대로 — 수정 금지. 상태·링크 변경은 여기 한 곳만) ──
const APPS = [
  {mono:"I&G", name:"Iron & Grace: Workout Timer", cat:"건강·피트니스", price:"$2.99", status:"review",
   kr:"찬양과 함께하는 운동 타이머 — Apple Watch 지원",
   en:"Workout timer with hymns, on iPhone & Apple Watch",
   privacy:null, store:null},
  {mono:"D&G", name:"Dawn & Grace", cat:"라이프스타일", price:"무료", status:"review",
   kr:"새벽예배의 리듬을 담은 묵상·기도 앱",
   en:"Dawn-prayer liturgy timer, scripture & prayer companion",
   privacy:null, store:null},
  {mono:"OH", name:"The Other Hours", cat:"건강·피트니스", price:"무료", status:"review",
   kr:"농구하는 아이를 둔 부모를 위한 훈련·성장 가이드",
   en:"Training & growth guide for parents of young basketball players",
   privacy:"https://cksals00-ai.github.io/sono-localift-dashboard/theotherhours_privacy.html", store:null},
  {mono:"HC", name:"Hangeul Cubs", cat:"교육", price:"무료", status:"review",
   kr:"호랑이 남매와 배우는 한글 — 영어·베트남어 지원",
   en:"Learn Hangeul with the Tiger Siblings — EN·VI",
   privacy:"hangeulcubs_privacy.html", store:null},
  {mono:"문", name:"문샷 — 모의투자 시뮬레이터", cat:"금융·교육", price:"$0.99", status:"review",
   kr:"어제의 종가로, 오늘의 판단 연습",
   en:"Paper-trading simulator for the Korean market. Not investment advice.",
   privacy:"moonshot_privacy.html", store:null},
  {mono:"K", name:"K-원정 플래너 (가칭)", cat:"여행", price:"무료", status:"prep",
   kr:"해외 팬의 한국 콘서트 원정 가이드",
   en:"Concert-trip companion for international K-culture fans",
   privacy:null, store:null},
];
const BADGE = {review:['review','심사 중'], live:['live','출시'], prep:['prep','준비 중']};
document.getElementById("apps").innerHTML = APPS.map(a=>{
  const [cls,label] = BADGE[a.status] || BADGE.prep;
  return `<div class="app">
    <div class="icon">${a.mono}</div>
    <div class="meta">
      <p class="name">${a.name}</p>
      <div class="cat">${a.cat}</div>
      <p class="desc">${a.kr}</p>
      <p class="desc en">${a.en}</p>
      <div class="row">
        <span class="badge ${cls}">${label}</span>
        <span class="price">${a.price}</span>
        ${a.store?`<a class="plink" href="${a.store}">App Store</a>`:""}
        ${a.privacy?`<span class="plink"><a href="${a.privacy}">개인정보처리방침</a></span>`:""}
      </div>
    </div>
  </div>`;
}).join("");
</script>
</body>
</html>
